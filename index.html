<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Independence Day 🇮🇳</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
background:linear-gradient(180deg,#ff9933,#ffffff,#138808);
min-height:100vh;overflow-x:hidden;padding:12px;text-align:center
}
.flag{position:fixed;top:10px;width:60px;z-index:1000;animation:wave 2s infinite}
.left{left:10px}.right{right:10px}
@keyframes wave{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.card{
max-width:700px;margin:auto;background:rgba(255,255,255,.2);
backdrop-filter:blur(12px);border-radius:24px;padding:15px;
box-shadow:0 10px 30px rgba(0,0,0,.2)
}
.hero{position:relative;overflow:hidden;border-radius:20px}
.hero .banner{width:100%;display:block}
.jet{position:absolute;width:180px;z-index:5}
.jet1{top:15px;left:-220px;animation:fly1 5s linear infinite}
.jet2{top:90px;left:-300px;animation:fly2 6s linear infinite}
@keyframes fly1{from{left:-220px}to{left:120%}}
@keyframes fly2{from{left:-300px}to{left:120%}}
.bigflag{font-size:70px;margin:10px 0;animation:wave 2s infinite}
h1{margin:10px 0}
input,button{width:100%;padding:14px;border-radius:12px;border:none;margin-top:10px}
button{background:#138808;color:#fff;font-weight:bold}
#wish{margin-top:15px;font-size:20px;line-height:1.5}
.balloon{
position:fixed;bottom:-80px;width:32px;height:42px;border-radius:50%;
animation:floatUp linear forwards;z-index:1
}
.balloon:after{
content:"";position:absolute;left:15px;top:40px;width:2px;height:24px;background:#666;
}
@keyframes floatUp{
from{transform:translateY(0)}
to{transform:translateY(-120vh)}
}
</style>
</head>
<body>

<img class="flag left" src="https://upload.wikimedia.org/wikipedia/commons/4/41/Flag_of_India.svg">
<img class="flag right" src="https://upload.wikimedia.org/wikipedia/commons/4/41/Flag_of_India.svg">

<div class="card">
<div class="hero">
<img src="rafale.png" class="jet jet1">
<img src="rafale.png" class="jet jet2">
<img src="banner.webp" class="banner" alt="Banner">
</div>

<div class="bigflag">🇮🇳</div>
<h1>Happy Independence Day 🇮🇳</h1>

<input id="name" placeholder="Enter Your Name">
<button onclick="generateWish()">Generate Wish</button>
<button onclick="shareWhatsApp()">Share on WhatsApp</button>

<div id="wish"></div>
</div>

<script>
const songs=["song1.mp3","song2.mp3","song3.mp3","song4.mp3","song5.mp3"];
const messages=[
"🇮🇳 उन वीर शहीदों को नमन, जिनकी कुर्बानी से आज हम आज़ाद हैं।",
"🇮🇳 तिरंगे की शान हमेशा ऊँची रहे।",
"🇮🇳 मिट्टी की खुशबू और देश के वीरों को सलाम।",
"🇮🇳 आज़ादी सिर्फ जश्न नहीं, बलिदान की याद है।",
"🇮🇳 भारत माता की जय। Happy Independence Day!"
];

const audio=new Audio(songs[Math.floor(Math.random()*songs.length)]);
audio.loop=true;
window.addEventListener("load",()=>audio.play().catch(()=>{}));

let currentMessage="";

const p=new URLSearchParams(location.search);
const from=p.get("from");
const msg=p.get("msg");
if(from && msg){
document.getElementById("wish").innerHTML="🇮🇳 <b>"+from+"</b> ki taraf se<br><br>"+decodeURIComponent(msg);
}

function generateWish(){
const name=document.getElementById("name").value.trim();
if(!name){alert("Enter your name");return;}
audio.play().catch(()=>{});
currentMessage=messages[Math.floor(Math.random()*messages.length)];
document.getElementById("wish").innerHTML=currentMessage+"<br><br><b>— "+name+"</b>";
}

function shareWhatsApp(){
const name=document.getElementById("name").value.trim();
if(!name || !currentMessage){alert("Generate wish first");return;}
const link=location.origin+location.pathname+"?from="+encodeURIComponent(name)+"&msg="+encodeURIComponent(currentMessage);
const text=currentMessage+"\n\n— "+name+"\n\n"+link;
window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");
}

const colors=["#FF9933","#FFFFFF","#138808"];
setInterval(()=>{
const b=document.createElement("div");
b.className="balloon";
b.style.left=Math.random()*100+"vw";
b.style.background=colors[Math.floor(Math.random()*colors.length)];
b.style.animationDuration=(8+Math.random()*6)+"s";
document.body.appendChild(b);
setTimeout(()=>b.remove(),15000);
},600);
</script>
</body>
</html>
